services:
  minio:
    image: quay.io/minio/minio
    container_name: mobo_minio_local
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: moboadmin
      MINIO_ROOT_PASSWORD: mobopassword
    volumes:
      - ./minio_data:/data
